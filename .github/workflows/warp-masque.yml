name: 生成 WARP MASQUE 配置

on:
  workflow_dispatch:
    inputs:
      device_name:
        description: 设备名（WARP 后台显示用）
        required: false
        default: gh-actions
      retention_days:
        description: artifact 保留天数
        required: false
        default: '7'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载 usque
        run: |
          set -euo pipefail
          VER=$(curl -sL https://api.github.com/repos/Diniboy1123/usque/releases/latest \
                | jq -r '.tag_name' | sed 's/^v//')
          echo "usque 版本 $VER"
          curl -sL -o usque.zip \
            "https://github.com/Diniboy1123/usque/releases/download/v${VER}/usque_${VER}_linux_amd64.zip"
          unzip -oq usque.zip
          chmod +x usque
          # 没有 config.json 时 usque version 会先打一条 error，不影响结果
          ./usque version 2>/dev/null | grep -i version || true

      - name: 注册设备并生成密钥
        run: |
          set -euo pipefail
          ./usque register -a -n "${{ github.event.inputs.device_name || 'gh-actions' }}"
          test -s config.json
          # 只打印非敏感字段，密钥不进日志
          python3 - <<'PY'
          import json
          c = json.load(open("config.json"))
          print("endpoint_v4 =", c["endpoint_v4"])
          print("endpoint_v6 =", c["endpoint_v6"])
          print("内网地址 =", c["ipv4"], "/", c["ipv6"])
          PY

      - name: 生成 mihomo 配置
        run: python3 scripts/gen_masque.py config.json dist

      - name: Commit Changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Changes detected in the repository."
            git config core.ignorecase false
            git config --local user.email "actions@github.com"
            git config --local user.name "GitHub Action"
            git add .
            git commit -m "Updated at $(date '+%Y-%m-%d %H:%M:%S')"
            git push
          else
            echo "No changes detected in the repository."
          fi
